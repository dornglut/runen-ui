name: Staged refusal proof metrics (experimental)

on:
  pull_request:
    paths:
      - crates/runenui_runtime/tests/staged_transaction_feasibility.rs
      - .github/workflows/staged-refusal-proof.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate expected head
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Execute bounded proof with visible measurements
        run: cargo +stable test --locked -p runenui_runtime --features internal-test-seams --test application_command staged_transaction_feasibility -- --nocapture
