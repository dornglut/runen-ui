name: CI linker diagnostic

on:
  push:
    branches:
      - codex/issue-383-mold-diagnostic

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.order }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        order:
          - default-then-mold
          - mold-then-default
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal

      - name: Install pinned upstream mold
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mold-2.42.1-x86_64-linux.tar.gz"
          root="${RUNNER_TEMP}/mold-2.42.1-x86_64-linux"
          curl --fail --location --silent --show-error \
            https://github.com/rui314/mold/releases/download/v2.42.1/mold-2.42.1-x86_64-linux.tar.gz \
            --output "${archive}"
          echo "6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          mold_bin="$(find "${root}" -type f -name mold -perm -u+x -print -quit)"
          [[ -n "${mold_bin}" ]]
          echo "$(dirname "${mold_bin}")" >> "${GITHUB_PATH}"

      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_OS=${ImageOS:-unknown}"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}"
          rustc +stable -vV
          cargo +stable -V
          mold --version
          cc --version | head -n 1
          sysroot="$(rustc +stable --print sysroot)"
          rust_lld="${sysroot}/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          if [[ -x "${rust_lld}" ]]; then
            "${rust_lld}" -flavor gnu --version
          fi

      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fetch --locked

      - name: Compare source-fresh test builds
        shell: bash
        env:
          ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail

          run_sample() {
            local mode="$1"
            local log="${RUNNER_TEMP}/linker-${mode}.log"

            cargo +stable clean
            local started ended elapsed status
            started="$(date +%s%N)"
            set +e
            if [[ "${mode}" == "mold" ]]; then
              RUSTFLAGS="-C link-arg=-fuse-ld=mold" \
                cargo +stable test --workspace --all-features --locked --no-run \
                >"${log}" 2>&1
              status=$?
            else
              env -u RUSTFLAGS \
                cargo +stable test --workspace --all-features --locked --no-run \
                >"${log}" 2>&1
              status=$?
            fi
            set -e
            ended="$(date +%s%N)"
            elapsed="$(python -c 'import sys; print(f"{(int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000:.3f}")' "${started}" "${ended}")"
            echo "RESULT order=${ORDER} mode=${mode} seconds=${elapsed} status=${status}"
            echo "--- ${mode} final log ---"
            tail -n 20 "${log}" || true
            echo "--- end ${mode} final log ---"
            if [[ "${status}" -ne 0 ]]; then
              exit "${status}"
            fi
          }

          case "${ORDER}" in
            default-then-mold)
              run_sample default
              run_sample mold
              ;;
            mold-then-default)
              run_sample mold
              run_sample default
              ;;
            *)
              echo "unknown order: ${ORDER}" >&2
              exit 2
              ;;
          esac
