name: Temporary M7 Counter cold-review fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply bounded cold-review fixes
        shell: python
        run: |
          from pathlib import Path
          native = Path('examples/counter/src/bin/native.rs')
          text = native.read_text()
          marker = "    fn cancel_mouse_for_device_change(\n"
          insert = "    fn handle_native_point_authority_loss(\n        &mut self,\n        event_loop: &ActiveEventLoop,\n        reason: &str,\n    ) -> bool {\n        if !self.invalidate_mouse_point_authority(event_loop, reason) {\n            return false;\n        }\n        self.drive_runtime(event_loop);\n        self.request_pending_redraw();\n        true\n    }\n\n"
          assert text.count(marker) == 1
          text = text.replace(marker, insert + marker)
          old = "            WindowEvent::CursorLeft { .. } => {\n                let _ =\n                    self.invalidate_mouse_point_authority(event_loop, \"native cursor left window\");\n            }"
          new = "            WindowEvent::CursorLeft { .. } => {\n                let _ = self.handle_native_point_authority_loss(\n                    event_loop,\n                    \"native cursor left window\",\n                );\n            }"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "                let _ =\n                    self.invalidate_mouse_point_authority(event_loop, \"native window lost focus\");\n                self.modifiers = KeyModifiers::NONE;"
          new = "                if !self.handle_native_point_authority_loss(\n                    event_loop,\n                    \"native window lost focus\",\n                ) {\n                    return;\n                }\n                self.modifiers = KeyModifiers::NONE;"
          assert text.count(old) == 1
          native.write_text(text.replace(old, new))

          audit = Path('xtask/src/repository_audit/workspace.rs')
          text = audit.read_text()
          old = "const RENDER_WGPU_FORBIDDEN_DEPENDENCIES: &[&str] =\n    &[\"winit\", \"accesskit\", \"accesskit_winit\", \"raw-window-handle\"];"
          new = old + "\nconst WINIT_FORBIDDEN_DEPENDENCIES: &[&str] = &[\"wgpu\"];"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "        if package == RENDER_WGPU_PACKAGE {\n            validate_renderer_external_dependencies(\n                &relative,\n                &dependencies,\n                &dev_dependencies,\n                findings,\n            );\n        }\n        members.push(WorkspaceMember {"
          new = "        if package == RENDER_WGPU_PACKAGE {\n            validate_renderer_external_dependencies(\n                &relative,\n                &dependencies,\n                &dev_dependencies,\n                findings,\n            );\n        }\n        if package == WINIT_PACKAGE {\n            validate_winit_external_dependencies(\n                &relative,\n                &dependencies,\n                &dev_dependencies,\n                findings,\n            );\n        }\n        members.push(WorkspaceMember {"
          assert text.count(old) == 1
          text = text.replace(old, new)
          marker = "    if member.package == REFERENCE_WINIT_PACKAGE\n        && !workspace_dependencies.contains(RENDER_WGPU_PACKAGE)\n"
          insert = "    if member.package == WINIT_PACKAGE {\n        for dependency in [CORE_PACKAGE, RUNTIME_PACKAGE] {\n            if !workspace_dependencies.contains(dependency) {\n                findings.push(Finding::fatal(\n                    \"workspace.winit_public_dependency_missing\",\n                    Some(path_text(&member.relative.join(\"Cargo.toml\"))),\n                    format!(\"runenui_winit must depend on public workspace package `{dependency}`\"),\n                ));\n            }\n        }\n    }\n\n    if matches!(member.package.as_str(), REFERENCE_WINIT_PACKAGE | \"counter\")\n        && !workspace_dependencies.contains(WINIT_PACKAGE)\n    {\n        findings.push(Finding::fatal(\n            \"workspace.native_consumer_winit_dependency_missing\",\n            Some(path_text(&member.relative.join(\"Cargo.toml\"))),\n            format!(\"{} must consume runenui_winit as an accepted M7 native consumer\", member.package),\n        ));\n    }\n\n    if member.package == \"counter\" && !workspace_dependencies.contains(RENDER_WGPU_PACKAGE) {\n        findings.push(Finding::fatal(\n            \"workspace.counter_renderer_dependency_missing\",\n            Some(path_text(&member.relative.join(\"Cargo.toml\"))),\n            \"counter must consume runenui_render_wgpu as the M7 native application showcase\",\n        ));\n    }\n\n"
          assert text.count(marker) == 1
          text = text.replace(marker, insert + marker)
          marker = "fn parse_workspace_members(contents: &str) -> Option<Vec<PathBuf>> {"
          insert = "fn validate_winit_external_dependencies(\n    relative: &Path,\n    dependencies: &BTreeSet<String>,\n    dev_dependencies: &BTreeSet<String>,\n    findings: &mut Vec<Finding>,\n) {\n    for forbidden in WINIT_FORBIDDEN_DEPENDENCIES {\n        if dependencies.contains(*forbidden) || dev_dependencies.contains(*forbidden) {\n            findings.push(Finding::fatal(\n                \"workspace.winit_forbidden_renderer_dependency\",\n                Some(path_text(&relative.join(\"Cargo.toml\"))),\n                format!(\"runenui_winit must not depend on renderer/backend package `{forbidden}`\"),\n            ));\n        }\n    }\n}\n\n"
          assert text.count(marker) == 1
          text = text.replace(marker, insert + marker)
          old = "        CORE_PACKAGE, EXTERNAL_WIDGET_PACKAGE, REFERENCE_WINIT_PACKAGE, RENDER_WGPU_PACKAGE,\n        RUNTIME_PACKAGE, TESTING_PACKAGE, WorkspaceMember, documented_package_names,\n        parse_dependency_names, parse_package_name, parse_workspace_members,\n        validate_dependency_direction, validate_renderer_external_dependencies,\n    };"
          new = "        CORE_PACKAGE, EXTERNAL_WIDGET_PACKAGE, REFERENCE_WINIT_PACKAGE, RENDER_WGPU_PACKAGE,\n        RUNTIME_PACKAGE, TESTING_PACKAGE, WINIT_PACKAGE, WorkspaceMember, documented_package_names,\n        parse_dependency_names, parse_package_name, parse_workspace_members,\n        validate_dependency_direction, validate_renderer_external_dependencies,\n        validate_winit_external_dependencies,\n    };"
          assert text.count(old) == 1
          text = text.replace(old, new)
          marker = "    #[test]\n    fn reference_winit_may_consume_renderer_but_generic_examples_may_not() {"
          insert = "    #[test]\n    fn winit_adapter_requires_public_core_runtime_and_rejects_renderer_backend() {\n        let core = member(\"crates/runenui_core\", CORE_PACKAGE, BTreeSet::new(), BTreeSet::new());\n        let runtime = member(\"crates/runenui_runtime\", RUNTIME_PACKAGE, BTreeSet::from([CORE_PACKAGE.to_owned()]), BTreeSet::new());\n        let winit = member(\"crates/runenui_winit\", WINIT_PACKAGE, BTreeSet::from([CORE_PACKAGE.to_owned(), RUNTIME_PACKAGE.to_owned()]), BTreeSet::new());\n        let members = BTreeMap::from([(core.package.as_str(), &core), (runtime.package.as_str(), &runtime), (winit.package.as_str(), &winit)]);\n        let mut findings = Vec::new();\n        validate_dependency_direction(&winit, &members, &mut findings);\n        validate_winit_external_dependencies(&winit.relative, &winit.dependencies, &winit.dev_dependencies, &mut findings);\n        assert!(findings.is_empty());\n        let missing_runtime = member(\"crates/runenui_winit\", WINIT_PACKAGE, BTreeSet::from([CORE_PACKAGE.to_owned()]), BTreeSet::new());\n        let missing_members = BTreeMap::from([(core.package.as_str(), &core), (runtime.package.as_str(), &runtime), (missing_runtime.package.as_str(), &missing_runtime)]);\n        let mut missing_findings = Vec::new();\n        validate_dependency_direction(&missing_runtime, &missing_members, &mut missing_findings);\n        assert!(missing_findings.iter().any(|finding| finding.code == \"workspace.winit_public_dependency_missing\"));\n        let mut forbidden_findings = Vec::new();\n        validate_winit_external_dependencies(&winit.relative, &BTreeSet::from([CORE_PACKAGE.to_owned(), RUNTIME_PACKAGE.to_owned(), \"wgpu\".to_owned()]), &BTreeSet::new(), &mut forbidden_findings);\n        assert_eq!(forbidden_findings.iter().filter(|finding| finding.code == \"workspace.winit_forbidden_renderer_dependency\").count(), 1);\n    }\n\n"
          assert text.count(marker) == 1
          text = text.replace(marker, insert + marker)
          old = "        let reference = member(\n            \"examples/reference_winit\",\n            REFERENCE_WINIT_PACKAGE,\n            BTreeSet::from([\n                CORE_PACKAGE.to_owned(),\n                RUNTIME_PACKAGE.to_owned(),\n                RENDER_WGPU_PACKAGE.to_owned(),\n            ]),\n            BTreeSet::new(),\n        );\n        let members = BTreeMap::from([\n            (core.package.as_str(), &core),\n            (runtime.package.as_str(), &runtime),\n            (renderer.package.as_str(), &renderer),\n            (reference.package.as_str(), &reference),\n        ]);"
          new = "        let winit = member(\n            \"crates/runenui_winit\",\n            WINIT_PACKAGE,\n            BTreeSet::from([CORE_PACKAGE.to_owned(), RUNTIME_PACKAGE.to_owned()]),\n            BTreeSet::new(),\n        );\n        let reference = member(\n            \"examples/reference_winit\",\n            REFERENCE_WINIT_PACKAGE,\n            BTreeSet::from([\n                CORE_PACKAGE.to_owned(),\n                RUNTIME_PACKAGE.to_owned(),\n                RENDER_WGPU_PACKAGE.to_owned(),\n                WINIT_PACKAGE.to_owned(),\n            ]),\n            BTreeSet::new(),\n        );\n        let members = BTreeMap::from([\n            (core.package.as_str(), &core),\n            (runtime.package.as_str(), &runtime),\n            (renderer.package.as_str(), &renderer),\n            (winit.package.as_str(), &winit),\n            (reference.package.as_str(), &reference),\n        ]);"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "        let missing_members = BTreeMap::from([\n            (core.package.as_str(), &core),\n            (runtime.package.as_str(), &runtime),\n            (renderer.package.as_str(), &renderer),\n            (missing_renderer.package.as_str(), &missing_renderer),\n        ]);"
          new = "        let missing_members = BTreeMap::from([\n            (core.package.as_str(), &core),\n            (runtime.package.as_str(), &runtime),\n            (renderer.package.as_str(), &renderer),\n            (winit.package.as_str(), &winit),\n            (missing_renderer.package.as_str(), &missing_renderer),\n        ]);"
          assert text.count(old) == 1
          audit.write_text(text.replace(old, new))
      - run: cargo +stable fmt --all
      - name: Commit bounded cold-review fixes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Cold-review fixes already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/counter/src/bin/native.rs xtask/src/repository_audit/workspace.rs
          git commit -m 'M7: fix Counter point-authority publication and enforce adapter boundary'
          git push origin "HEAD:${HEAD_BRANCH}"
