name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: RunenUI validation
    uses: dornglut/github-workflows/.github/workflows/reusable-rust-cargo-validate.yml@718f53a5601f4fc89d8a8b1deab89550d36b70a9
