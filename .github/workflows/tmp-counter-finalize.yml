name: Temporary M7 Counter final source fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply bounded Clippy and current-state fixes
        shell: python
        run: |
          from pathlib import Path

          native = Path('examples/counter/src/bin/native.rs')
          text = native.read_text()
          old = "        let translated = match self.translate_latest_cursor() {\n            Ok(translated) => Some(translated),\n            Err(_) => {\n                if !self.invalidate_mouse_point_authority(\n                    event_loop,\n                    \"button transition arrived without matching displayed point authority\",\n                ) {\n                    return;\n                }\n                None\n            }\n        };"
          new = "        let translated = if let Ok(translated) = self.translate_latest_cursor() {\n            Some(translated)\n        } else {\n            if !self.invalidate_mouse_point_authority(\n                event_loop,\n                \"button transition arrived without matching displayed point authority\",\n            ) {\n                return;\n            }\n            None\n        };"
          assert text.count(old) == 1, 'unexpected pointer translation shape'
          text = text.replace(old, new)
          old = '                        eprintln!("Counter accessibility action rejected by runtime: {error:?}")'
          new = '                        eprintln!("Counter accessibility action rejected by runtime: {error:?}");'
          assert text.count(old) == 1, 'unexpected accessibility rejection shape'
          native.write_text(text.replace(old, new))

          public_api = Path('docs/architecture/public-api.md')
          text = public_api.read_text()
          old = 'M7 has accepted the first real wgpu renderer/resource edge, standalone winit host/native-input/presentation path, AccessKit semantic adapter, and second-consumer pressure for a bounded reusable winit adapter edge. M7 remains incomplete until the native Counter application showcase is accepted and M7D external-host closure is complete.'
          new = 'M7 has accepted the first real wgpu renderer/resource edge, standalone winit host/native-input/presentation path, and AccessKit semantic adapter, and this native application slice establishes the bounded reusable winit adapter plus native Counter showcase from demonstrated second-consumer pressure. M7 remains incomplete until M7D external-host closure is accepted.'
          assert text.count(old) == 1, 'unexpected M7 current-state wording'
          public_api.write_text(text.replace(old, new))
      - run: cargo +stable fmt --all
      - name: Commit bounded final source fixes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Final source fixes already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/counter/src/bin/native.rs docs/architecture/public-api.md
          git commit -m 'M7: finish Counter native candidate source'
          git push origin "HEAD:${HEAD_BRANCH}"
