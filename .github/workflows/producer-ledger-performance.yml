name: Producer Ledger Performance Evidence

on:
  pull_request:
    paths:
      - .github/workflows/producer-ledger-performance.yml
      - crates/runenui_runtime/src/queue.rs
      - crates/runenui_runtime/tests/producer_workload.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producer-ledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Exact-head release-mode root ledger measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve expected revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected_revision="$PR_HEAD_SHA" ;;
            workflow_dispatch) expected_revision="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected_revision"
          echo "expected_revision=$expected_revision" >> "$GITHUB_OUTPUT"

      - name: Checkout exact feature revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected_revision }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prove source and runner identity
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          mkdir -p "${RUNNER_TEMP}/producer-ledger-evidence"
          {
            echo "HEAD=$EXPECTED_REVISION"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "RUNNER_ARCH=$RUNNER_ARCH"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            uname -a
            nproc
            lscpu | grep -E 'Model name|CPU\(s\)|Architecture|Thread|Core|Socket' || true
            free -m
          } | tee "${RUNNER_TEMP}/producer-ledger-evidence/environment.txt"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Measure immutable-root admission and keyed release
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/producer-ledger-evidence"
          rustc +stable --version --verbose | tee "$evidence/rustc.txt"
          cargo +stable test --release --locked --all-features -p runenui_runtime \
            --test m10_semantic_integrity \
            bench_u475_accumulated_noop_root_admission_scaling \
            -- --ignored --nocapture 2>&1 | tee "$evidence/admission.log"
          cargo +stable test --release --locked --all-features -p runenui_runtime \
            --lib bench_u475_keyed_generation_release_scaling \
            -- --ignored --nocapture 2>&1 | tee "$evidence/keyed-release.log"
          printf '%s\n' 'phase,trace,roots,repeats,p50_us,p95_us,max_us,observed_process_rss_kib' \
            > "$evidence/metrics.csv"
          sed -n 's/^.*U475_METRIC,//p' "$evidence/admission.log" \
            >> "$evidence/metrics.csv"
          sed -n 's/^.*U475_METRIC,//p' "$evidence/keyed-release.log" \
            >> "$evidence/metrics.csv"
          test "$(wc -l < "$evidence/metrics.csv")" -eq 13
          cat "$evidence/metrics.csv"
          git diff --check
          test -z "$(git status --short)"

      - name: Upload revision-bound performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: producer-ledger-${{ steps.revision.outputs.expected_revision }}
          path: ${{ runner.temp }}/producer-ledger-evidence
          if-no-files-found: error
          retention-days: 7
