name: Temporary M7 Counter source normalization

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: python .github/tmp-counter-normalize.py
      - run: cargo +stable fmt --all
      - name: Commit normalized source when changed
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Source already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtask/src/repository_audit/workspace.rs examples/counter/src/main.rs crates/runenui_winit examples/counter/src/bin/native.rs examples/counter/src/ui.rs examples/reference_winit/src/accessibility.rs examples/reference_winit/src/device_identity.rs examples/reference_winit/src/keyboard_input.rs examples/reference_winit/src/mouse_input.rs
          git commit -m "M7: normalize native Counter source"
          git push origin "HEAD:${HEAD_BRANCH}"
