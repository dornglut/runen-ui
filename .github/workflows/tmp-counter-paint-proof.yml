name: Temporary Counter paint proof

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Add deterministic paint proof and native guidance
        shell: python
        run: |
          from pathlib import Path
          nl = '\n'

          main = Path('examples/counter/src/main.rs')
          text = main.read_text()
          marker = '    fn primary_pointer_event(\n'
          helper = nl.join([
              '    fn published_paint_colors(counter: Counter) -> Vec<runenui_core::Color> {',
              '        let mut runtime = mounted_counter(counter);',
              '        let tokens = StyleTokens::new();',
              '        let context = SurfaceBuildContext::tight(',
              '            &tokens,',
              '            LogicalSize::new(LogicalLength::from(240_u16), LogicalLength::from(160_u16)),',
              '        );',
              '        let publication = runtime',
              '            .publish_surface(&context)',
              '            .unwrap_or_else(|_| unreachable!("counter paint publication is admitted"));',
              '        publication',
              '            .paint_scene()',
              '            .items()',
              '            .iter()',
              '            .filter_map(|item| item.primitive().color())',
              '            .collect()',
              '    }',
              '',
              '',
          ])
          assert text.count(marker) == 1, 'unexpected pointer helper marker'
          text = text.replace(marker, helper + marker)
          marker = '    #[test]\n    fn counter_screen_is_used_before_win_count() {'
          test = nl.join([
              '    #[test]',
              '    fn counter_state_changes_have_distinct_literal_paint_publications() {',
              '        let zero = published_paint_colors(Counter::new());',
              '        let one = published_paint_colors(Counter { count: 1 });',
              '        let win = published_paint_colors(Counter { count: WIN_COUNT });',
              '',
              '        assert!(!zero.is_empty());',
              '        assert_ne!(zero, one);',
              '        assert_ne!(one, win);',
              '    }',
              '',
              '',
          ])
          assert text.count(marker) == 1, 'unexpected Counter test marker'
          main.write_text(text.replace(marker, test + marker))

          readme = Path('examples/counter/README.md')
          text = readme.read_text()
          old = '- click **-**, **+**, or **Reset** with the mouse;'
          new = '- because M7 does not render glyphs yet, use the horizontal control row by position: left = decrement, middle = increment, right muted-red = reset;\n- each count change alters the filled count rectangle; reaching the win count switches the screen background to green;'
          assert text.count(old) == 1, 'unexpected native mouse guidance'
          readme.write_text(text.replace(old, new))
      - run: cargo +stable fmt --all
      - name: Commit final proof change
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/counter/src/main.rs examples/counter/README.md
          if git diff --cached --quiet; then
            echo 'Paint proof already applied'
            exit 0
          fi
          git commit -m 'M7: prove Counter state changes alter paint publication'
          git push origin "HEAD:${HEAD_BRANCH}"
