name: M8B lockfile bootstrap

on:
  push:
    branches:
      - codex/m8b-production-text

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/m8b-production-text

      - name: Install repository Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Generate and commit Cargo.lock
        run: |
          set -euo pipefail
          cargo +1.93.0 generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "M8B: refresh Cargo lockfile"
          git push origin HEAD:codex/m8b-production-text
