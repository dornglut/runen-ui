name: RunenSDF Candidate Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - validation/runen-sdf-pt-003
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runen-sdf-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact standalone candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: validation/runen-sdf
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/runen-sdf-pt-003
          clean: true
          fetch-depth: 1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install MSRV Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: validation/runen-sdf

      - name: Validate through maintained repository authority
        run: cargo +stable validate
