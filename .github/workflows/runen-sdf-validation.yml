name: RunenSDF Candidate Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - validation/runen-sdf-pt-003
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runen-sdf-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact standalone candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: validation/runen-sdf
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/runen-sdf-pt-003
          clean: true
          fetch-depth: 1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install MSRV Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: validation/runen-sdf

      - name: Locked metadata
        run: cargo +stable metadata --format-version 1 --locked --no-deps

      - name: Dependency direction
        run: |
          cargo +stable tree -p runen-sdf --locked
          cargo +stable tree -i runen-sdf --workspace --locked

      - name: Formatting
        run: cargo +stable fmt --all -- --check

      - name: Stable tests and downstream conformance
        run: cargo +stable test --workspace --locked

      - name: Denied-warning Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: Denied-warning rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --locked

      - name: MSRV tests
        run: cargo +1.93.0 test --workspace --locked

      - name: Diff hygiene
        working-directory: .
        run: git diff --check
