name: Issue 269 Parley migration probe

on:
  push:
    branches:
      - issue-269-parley-upstream-migration-proof

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Resolve lockfile and compile runenui_text
        id: probe
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo +stable check -p runenui_text 2>&1 | tee issue269-cargo-check.log
          status="${PIPESTATUS[0]}"
          cp Cargo.lock issue269-Cargo.lock
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload lockfile and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue269-parley-migration-probe
          path: |
            issue269-Cargo.lock
            issue269-cargo-check.log
          if-no-files-found: error
          retention-days: 1
