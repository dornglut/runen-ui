name: Milestone slice
description: Define one bounded accepted roadmap/conformance delivery slice.
title: "[M?] "
body:
  - type: markdown
    attributes:
      value: |
        Use one issue for one coherent delivery slice. Permanent behavioral requirements live in conformance documents; live execution, review, and blocker state live in GitHub.
  - type: textarea
    id: authority
    attributes:
      label: Governing authority
      description: Link the relevant roadmap section, ADR/design, architecture owner, and conformance contract.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and required outcome
      description: State the concrete current problem and the observable outcome this slice must deliver.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Name accepted prerequisites and blocking work, if any. Do not predeclare speculative branch or PR identifiers.
    validations:
      required: true
  - type: textarea
    id: conformance
    attributes:
      label: Conformance obligations
      description: List permanent IDs and required positive, negative, diagnostic, or trace proof obligations, or state why this slice has none.
    validations:
      required: true
  - type: textarea
    id: included
    attributes:
      label: Included work
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence
      description: Name focused checks/proofs in addition to the canonical cargo validate baseline.
    validations:
      required: true
  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop conditions
      description: State material unknowns or boundary changes that require investigation or authority revision before implementation/merge continues.
    validations:
      required: true
