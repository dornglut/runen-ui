name: Bug report
description: Report a reproducible defect in current RunenUI behavior or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        RunenUI is experimental pre-1.0 software under owner-only development. Use this form for reproducible defects, not feature requests, architecture proposals, implementation offers, or security vulnerabilities.

  - type: input
    id: revision
    attributes:
      label: Affected revision
      description: Provide the exact commit SHA, branch, tag, or package version.
      placeholder: commit SHA or version
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Observed defect
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest complete sequence, code sample, or repository link needed to reproduce the defect.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the behavior required by current documentation, tests, or public contracts.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Rust version, target triple, enabled features, and relevant host or toolchain details.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Include non-sensitive logs, diagnostics, screenshots, or links that help establish the defect.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and current project documentation for this defect.
          required: true
        - label: This report contains no secrets, vulnerability details, or private information.
          required: true
        - label: I understand that external code contributions and unsolicited pull requests are not currently accepted.
          required: true
