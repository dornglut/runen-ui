name: Bug
description: Report a reproducible defect in accepted behavior.
title: "[Bug] "
body:
  - type: textarea
    id: accepted_contract
    attributes:
      label: Violated accepted contract
      description: Link the matrix row, ADR, test contract, or accepted public behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact inputs, sequence, environment, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Integrity, ownership, and user impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, trace, tests, and relevant files
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Exact accepted base, suspected regression range, and current blocker
    validations:
      required: true
