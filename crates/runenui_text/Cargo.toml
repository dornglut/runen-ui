[package]
name = "runenui_text"
version.workspace = true
description = "Renderer-neutral production text shaping and logical resource boundary for RunenUI"
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
runenui_core = { path = "../runenui_core", version = "0.1.0" }
parley = { version = "0.11.1", default-features = false, features = ["std", "complex-scripts"] }
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }

