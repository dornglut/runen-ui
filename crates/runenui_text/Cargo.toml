[package]
name = "runenui_text"
version.workspace = true
description = "Renderer-neutral production text shaping and logical resource boundary for RunenUI"
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
runenui_core = { path = "../runenui_core", version = "0.1.0" }
parley = { git = "https://github.com/linebender/parley", rev = "49df9836930fb0db229a35b2d6c5360a7e6e2fa0", default-features = false, features = ["std", "complex-scripts"] }
fontique = { git = "https://github.com/linebender/parley", rev = "49df9836930fb0db229a35b2d6c5360a7e6e2fa0", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
unicode-segmentation = "1.13.3"

[features]
internal-test-seams = []

[lints]
workspace = true
