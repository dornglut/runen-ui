[package]
name = "runenui_runtime"
version.workspace = true
description = "Deterministic headless runtime and diagnostic publication proof for RunenUI"
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
autotests = false

[[test]]
name = "application_command"
path = "tests/suites/application_command.rs"

[[test]]
name = "focus_keyboard_input"
path = "tests/suites/focus_keyboard_input.rs"

[[test]]
name = "pointer"
path = "tests/suites/pointer.rs"

[[test]]
name = "motion"
path = "tests/suites/motion.rs"

[[test]]
name = "presentation_style"
path = "tests/suites/presentation_style.rs"

[[test]]
name = "m10_semantic_integrity"
path = "tests/suites/m10_semantic_integrity.rs"

[[test]]
name = "trace"
path = "tests/suites/trace.rs"

[[test]]
name = "surface_constraints"
path = "tests/suites/surface_constraints.rs"

[[test]]
name = "scheduling_work"
path = "tests/suites/scheduling_work.rs"

[[test]]
name = "lifecycle_identity"
path = "tests/suites/lifecycle_identity.rs"

[[test]]
name = "surface_context"
path = "tests/surface_context.rs"

[[test]]
name = "text_leaf_alignment"
path = "tests/text_leaf_alignment.rs"

[dependencies]
runenui_core = { path = "../runenui_core", version = "0.1.0" }
runenui_text = { path = "../runenui_text", version = "0.1.0" }
serde_json = "1.0.151"
taffy = { version = "=0.14.0", default-features = false, features = ["flexbox", "grid", "block_layout", "content_size"] }

[features]
internal-test-seams = ["runenui_core/internal-test-seams", "runenui_text/internal-test-seams"]

[lints]
workspace = true
