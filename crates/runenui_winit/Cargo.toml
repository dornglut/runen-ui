[package]
name = "runenui_winit"
version.workspace = true
description = "Reusable winit and AccessKit translation edge for RunenUI"
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
accesskit = { version = "=0.24.1", default-features = false }
accesskit_winit = { version = "=0.33.2", default-features = false, features = ["rwh_06"] }
runenui_core = { path = "../runenui_core", version = "0.1.0" }
runenui_runtime = { path = "../runenui_runtime", version = "0.1.0" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[lints]
workspace = true
