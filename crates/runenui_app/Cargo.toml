[package]
name = "runenui_app"
version.workspace = true
description = "Opt-in fluent independent native desktop application composition for RunenUI"
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

[features]
# A debug-only, opt-in native presentation fault-injection seam for OS smoke.
internal-test-seams = []

[dependencies]
accesskit_winit = { version = "=0.33.2", default-features = false, features = ["rwh_06"] }
runenui_core = { path = "../runenui_core", version = "0.1.0" }
runenui_render_wgpu = { path = "../runenui_render_wgpu", version = "0.1.0" }
runenui_runtime = { path = "../runenui_runtime", version = "0.1.0" }
runenui_winit = { path = "../runenui_winit", version = "0.1.0" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[lints]
workspace = true
