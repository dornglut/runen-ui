description = "Comprehensive active-repository audit context. Historical legacy content is excluded."

include = [
  "**/*",
]

exclude = [
  ".git/**",
  "target/**",
  "node_modules/**",
  "dist/**",
  "build/**",
  ".astro/**",
  ".context/**",
  "context/**",
  "context-exports/**",
  "**/*-content.txt",
  "**/*-context.txt",
  "*.repo-context.txt",
  "*.repo-context.md",
  "legacy/**",
]

extensions = [
  "json",
  "md",
  "mdx",
  "py",
  "ron",
  "rs",
  "toml",
  "wgsl",
  "yaml",
  "yml",
]

include_filenames = [
  "AGENTS.md",
  "Cargo.lock",
  "Cargo.toml",
  "LICENSE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]
