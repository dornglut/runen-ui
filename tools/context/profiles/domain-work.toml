description = "RunenUI domain and crate-level context for architecture or boundary review."

include = [
  "README.md",
  "Cargo.toml",
  "AGENTS.md",
  "ARCHITECTURE.md",
  "DEPENDENCY_RULES.md",
  "DOMAIN_MAP.md",
  "CRATES.md",
  "TESTING.md",
  "GLOSSARY.md",
  "docs/**",
  "design/**",
  "architecture/**",
  "src/**",
  "crates/*/Cargo.toml",
  "crates/*/README.md",
  "crates/*/src/lib.rs",
  "crates/*/tests/**",
  "examples/**",
]

exclude = [
  "legacy/**",
  "context/**",
]
